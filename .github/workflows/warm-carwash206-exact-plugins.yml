name: Warm Carwash 206 Exact Plugins

on:
  push:
    paths:
      - '.github/workflows/warm-carwash206-exact-plugins.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: false

      - name: Build public seed with exact Carwash 206 package versions
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version
          flutter create --platforms=android "$RUNNER_TEMP/carwash206_plugins_seed"
          cd "$RUNNER_TEMP/carwash206_plugins_seed"

          cat > pubspec.yaml <<'YAML'
          name: carwash206_plugins_seed
          description: Public dependency seed for offline Android cache
          publish_to: 'none'
          version: 0.0.1+1
          environment:
            sdk: '>=3.3.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: 1.6.0
            provider: 6.1.5+1
            path_provider: 2.1.5
            url_launcher: 6.3.2
            pdf: 3.12.0
            printing: 5.14.3
            share_plus: 10.1.4
            shared_preferences: 2.5.5
            device_info_plus: 10.1.2
            image_picker: 1.2.2
            google_mlkit_text_recognition: 0.13.0
            google_mlkit_image_labeling: 0.11.1
            image: 4.8.0
            mobile_scanner: 7.2.0
            qr: 3.0.2
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: 4.0.0
          flutter:
            uses-material-design: true
          YAML

          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          void main() => runApp(const MaterialApp(home: Scaffold(body: Text('cache seed'))));
          DART

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/settings.gradle.kts')
          s=p.read_text()
          s=re.sub(r'id\("com\.android\.application"\) version "[^"]+" apply false', 'id("com.android.application") version "8.11.1" apply false', s)
          s=re.sub(r'id\("org\.jetbrains\.kotlin\.android"\) version "[^"]+" apply false', 'id("org.jetbrains.kotlin.android") version "2.2.20" apply false', s)
          p.write_text(s)
          p=Path('android/gradle/wrapper/gradle-wrapper.properties')
          s=p.read_text()
          s=re.sub(r'distributionUrl=.*', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip', s)
          p.write_text(s)
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          s=s.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
          if 'androidx.core:core-ktx:1.13.1' not in s:
              s += '\n\ndependencies {\n    implementation("androidx.core:core-ktx:1.13.1")\n}\n'
          p.write_text(s)
          PY

          flutter pub get
          flutter build apk --debug
          ./android/gradlew -p android help --no-daemon
          test -f build/app/outputs/flutter-apk/app-debug.apk
          test -d "$HOME/.gradle/caches/modules-2"

      - name: Package and split exact Gradle cache
        shell: bash
        run: |
          set -euxo pipefail
          tar -C "$HOME/.gradle/caches" -cf - modules-2 | zstd -T0 -8 -o "$RUNNER_TEMP/carwash206-exact-modules.tar.zst"
          sha256sum "$RUNNER_TEMP/carwash206-exact-modules.tar.zst" > "$RUNNER_TEMP/carwash206-exact-modules.sha256"
          split -b 250M -d -a 2 "$RUNNER_TEMP/carwash206-exact-modules.tar.zst" "$RUNNER_TEMP/carwash206-exact-modules.part-"
          ls -lh "$RUNNER_TEMP"/carwash206-exact-modules.part-* "$RUNNER_TEMP/carwash206-exact-modules.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: carwash206-cache-part00
          path: ${{ runner.temp }}/carwash206-exact-modules.part-00
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: carwash206-cache-part01
          path: ${{ runner.temp }}/carwash206-exact-modules.part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: carwash206-cache-part02
          path: ${{ runner.temp }}/carwash206-exact-modules.part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: carwash206-cache-part03
          path: ${{ runner.temp }}/carwash206-exact-modules.part-03
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: carwash206-cache-part04
          path: ${{ runner.temp }}/carwash206-exact-modules.part-04
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: carwash206-cache-sha
          path: ${{ runner.temp }}/carwash206-exact-modules.sha256
          compression-level: 0
          retention-days: 1
