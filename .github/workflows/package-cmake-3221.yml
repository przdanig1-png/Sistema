name: Package Android CMake 3.22.1

on:
  push:
    paths:
      - '.github/workflows/package-cmake-3221.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install CMake 3.22.1 from Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | head -1); fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" 'cmake;3.22.1'
          test -x "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"
          tar -C "$ANDROID_SDK_ROOT/cmake" -cf - 3.22.1 | zstd -T0 -8 -o "$RUNNER_TEMP/android-cmake-3.22.1.tar.zst"
          sha256sum "$RUNNER_TEMP/android-cmake-3.22.1.tar.zst" > "$RUNNER_TEMP/cmake.sha256"
          ls -lh "$RUNNER_TEMP/android-cmake-3.22.1.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: android-cmake-3.22.1
          path: |
            ${{ runner.temp }}/android-cmake-3.22.1.tar.zst
            ${{ runner.temp }}/cmake.sha256
          compression-level: 0
          retention-days: 1
