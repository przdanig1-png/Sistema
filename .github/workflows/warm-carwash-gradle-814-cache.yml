name: Warm Carwash Gradle 8.14 Cache

on:
  push:
    paths:
      - '.github/workflows/warm-carwash-gradle-814-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle 8.14
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 https://services.gradle.org/distributions/gradle-8.14-bin.zip -o "$RUNNER_TEMP/gradle-8.14-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.14-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14/bin" >> "$GITHUB_PATH"

      - name: Warm exact plugin family
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/seed"
          cat > "$RUNNER_TEMP/seed/settings.gradle.kts" <<'KTS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "carwash-gradle-seed"
          KTS
          cat > "$RUNNER_TEMP/seed/build.gradle.kts" <<'KTS'
          plugins {
              `kotlin-dsl`
              id("com.android.application") version "8.11.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
              id("org.jetbrains.kotlin.jvm") version "2.2.20" apply false
          }
          KTS
          cd "$RUNNER_TEMP/seed"
          gradle --version
          gradle tasks --refresh-dependencies --no-daemon
          test -d "$HOME/.gradle/caches/modules-2/files-2.1/org.gradle.kotlin.kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.2.0"
          test -d "$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools.build/gradle/8.11.1"
          test -d "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-gradle-plugin/2.2.20"

      - name: Package Gradle modules cache
        shell: bash
        run: |
          set -euxo pipefail
          tar -C "$HOME/.gradle/caches" -cf - modules-2 | zstd -T0 -8 -o "$RUNNER_TEMP/carwash-gradle-814-modules.tar.zst"
          sha256sum "$RUNNER_TEMP/carwash-gradle-814-modules.tar.zst" > "$RUNNER_TEMP/carwash-gradle-814-modules.sha256"
          ls -lh "$RUNNER_TEMP/carwash-gradle-814-modules.tar.zst" "$RUNNER_TEMP/carwash-gradle-814-modules.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: carwash-gradle-814-modules
          path: |
            ${{ runner.temp }}/carwash-gradle-814-modules.tar.zst
            ${{ runner.temp }}/carwash-gradle-814-modules.sha256
          compression-level: 0
          retention-days: 1
