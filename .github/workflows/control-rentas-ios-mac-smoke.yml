name: Control Rentas iOS Mac Smoke

on:
  push:
    paths:
      - '.github/workflows/control-rentas-ios-mac-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-rentas-ios-mac-smoke
  cancel-in-progress: true

jobs:
  ios-smoke:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Show Apple toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          flutter --version
          ruby --version
          pod --version

      - name: Create source-free Control Rentas dependency seed
        shell: bash
        run: |
          set -euxo pipefail
          flutter create --platforms=ios --org com.example --project-name control_rentas_app seed
          cd seed
          cat > pubspec.yaml <<'PUBSPEC'
          name: control_rentas_app
          description: Source-free dependency smoke test for Control Rentas iOS
          publish_to: 'none'
          version: 0.5.110+419
          environment:
            sdk: '>=3.3.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            shared_preferences: ^2.2.3
            intl: ^0.19.0
            image_picker: ^1.1.2
            image: ^4.8.0
            share_plus: ^10.1.4
            path_provider: ^2.1.4
            pdf: ^3.11.1
            url_launcher: ^6.3.0
            file_picker: ^8.0.7
            archive: ^4.0.9
            local_auth: ^2.3.0
            firebase_core: ^3.6.0
            firebase_messaging: ^15.1.3
            cloud_firestore: ^5.6.12
            flutter_local_notifications: ^17.2.3
            timezone: ^0.9.4
            permission_handler: ^11.3.1
            audioplayers: ^6.1.0
            workmanager: 0.9.0+3
          dev_dependencies:
            flutter_lints: ^5.0.0
          flutter:
            uses-material-design: true
          PUBSPEC
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ios/Runner.xcodeproj/project.pbxproj')
          s=p.read_text().replace('IPHONEOS_DEPLOYMENT_TARGET = 13.0;', 'IPHONEOS_DEPLOYMENT_TARGET = 14.0;')
          p.write_text(s)
          p=Path('ios/Flutter/AppFrameworkInfo.plist')
          p.write_text(p.read_text().replace('<string>13.0</string>', '<string>14.0</string>'))
          PY
          flutter pub get

      - name: Build iOS simulator release without signing
        shell: bash
        run: |
          set -euxo pipefail
          cd seed
          flutter build ios --simulator --release
          test -d build/ios/iphonesimulator/Runner.app
          plutil -p build/ios/iphonesimulator/Runner.app/Info.plist | head -80
          du -sh build/ios/iphonesimulator/Runner.app

      - name: Compile iPhoneOS target with code signing disabled
        shell: bash
        run: |
          set -euxo pipefail
          cd seed
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/manual-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build
          test -d build/ios/manual-device/Build/Products/Release-iphoneos/Runner.app
          du -sh build/ios/manual-device/Build/Products/Release-iphoneos/Runner.app

      - name: Record smoke report
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/control-rentas-ios-smoke.txt" <<EOF
          Control Rentas iOS public Mac smoke: PASS
          Flutter: $(flutter --version | head -1)
          Xcode: $(xcodebuild -version | tr '\n' ' ')
          Runner: $RUNNER_OS / $RUNNER_ARCH
          Source code included: NO
          Signing material included: NO
          iOS simulator release build: PASS
          iPhoneOS unsigned compile: PASS
          EOF

      - name: Upload report only
        uses: actions/upload-artifact@v4
        with:
          name: control-rentas-ios-mac-smoke-report
          path: ${{ runner.temp }}/control-rentas-ios-smoke.txt
          retention-days: 7
          if-no-files-found: error
