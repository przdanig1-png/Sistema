name: Prepare FamilyGuard local emulator and missing cache

on:
  push:
    branches:
      - temp-android-sdk-bootstrap-20260815
  workflow_dispatch:

jobs:
  prepare-local-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install emulator and Android 35 Google APIs image
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Warm exact AndroidX core 1.13.1 cache in isolated Gradle home
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/fg-core-warm"
          GH="$RUNNER_TEMP/fg-core-gradle-home"
          rm -rf "$WORK" "$GH"
          mkdir -p "$WORK" "$GH"
          cd "$WORK"
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle.zip
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='fg-core-warm'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'base' }
          configurations { warm }
          dependencies {
            warm 'androidx.core:core:1.13.1'
            warm 'androidx.core:core-ktx:1.13.1'
          }
          tasks.register('warmDependencies') {
            doLast { configurations.warm.files.each { println it } }
          }
          EOF
          GRADLE_USER_HOME="$GH" ./gradle-8.14.3/bin/gradle warmDependencies --no-daemon --stacktrace
          mkdir -p "$RUNNER_TEMP/export-core"
          cp -a "$GH/caches/modules-2" "$RUNNER_TEMP/export-core/"
          tar -C "$RUNNER_TEMP/export-core" -czf "$GITHUB_WORKSPACE/familyguard-gradle-core-1.13.1-cache.tar.gz" .
          sha256sum "$GITHUB_WORKSPACE/familyguard-gradle-core-1.13.1-cache.tar.gz" > "$GITHUB_WORKSPACE/familyguard-gradle-core-1.13.1-cache.tar.gz.sha256"
          ls -lh "$GITHUB_WORKSPACE/familyguard-gradle-core-1.13.1-cache.tar.gz"

      - name: Pack emulator plus system image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export-emulator/system-images/android-35/google_apis
          cp -a "$ANDROID_SDK_ROOT/emulator" export-emulator/
          cp -a "$ANDROID_SDK_ROOT/system-images/android-35/google_apis/x86_64" export-emulator/system-images/android-35/google_apis/
          tar -C export-emulator -czf familyguard-emulator-api35-googleapis-x86_64.tar.gz .
          sha256sum familyguard-emulator-api35-googleapis-x86_64.tar.gz > familyguard-emulator-api35-googleapis-x86_64.tar.gz.sha256
          split -b 250M -d -a 2 familyguard-emulator-api35-googleapis-x86_64.tar.gz emulator.part-
          ls -lh familyguard-emulator-api35-googleapis-x86_64.tar.gz emulator.part-*
          cat familyguard-emulator-api35-googleapis-x86_64.tar.gz.sha256

      - name: Upload core cache
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-gradle-core-1-13-1-cache
          path: |
            familyguard-gradle-core-1.13.1-cache.tar.gz
            familyguard-gradle-core-1.13.1-cache.tar.gz.sha256
          compression-level: 0
          retention-days: 1

      - name: Upload emulator checksum
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-emulator-checksum
          path: familyguard-emulator-api35-googleapis-x86_64.tar.gz.sha256
          compression-level: 0
          retention-days: 1

      - name: Upload emulator part 00
        uses: actions/upload-artifact@v4
        with: { name: familyguard-emulator-part-00, path: emulator.part-00, compression-level: 0, retention-days: 1 }
      - name: Upload emulator part 01
        uses: actions/upload-artifact@v4
        with: { name: familyguard-emulator-part-01, path: emulator.part-01, compression-level: 0, retention-days: 1 }
      - name: Upload emulator part 02
        uses: actions/upload-artifact@v4
        with: { name: familyguard-emulator-part-02, path: emulator.part-02, compression-level: 0, retention-days: 1 }
      - name: Upload emulator part 03
        uses: actions/upload-artifact@v4
        with: { name: familyguard-emulator-part-03, path: emulator.part-03, compression-level: 0, retention-days: 1 }
      - name: Upload emulator part 04
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-emulator-part-04
          path: emulator.part-04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload emulator part 05
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-emulator-part-05
          path: emulator.part-05
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload emulator part 06
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-emulator-part-06
          path: emulator.part-06
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload emulator part 07
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-emulator-part-07
          path: emulator.part-07
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
