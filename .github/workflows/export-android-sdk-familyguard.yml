name: Export FamilyGuard Kids Kotlin compiler Maven repo

on:
  push:
    branches:
      - temp-android-sdk-bootstrap-20260815
  workflow_dispatch:

jobs:
  export-kotlin-compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve Kotlin compiler embeddable with all transitives
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/compiler-maven"
          rm -rf "$OUT"; mkdir -p "$OUT"
          mvn -q -Dmaven.repo.local="$OUT" org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact=org.jetbrains.kotlin:kotlin-compiler-embeddable:2.0.21 \
            -Dtransitive=true
          test -f "$OUT/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.jar"
          find "$OUT" -type f \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \) -printf '%P %s\n' | sort > compiler-maven-files.txt
          tar -C "$OUT" -czf familyguard-kids-kotlin-compiler-2.0.21-maven.tar.gz .
          sha256sum familyguard-kids-kotlin-compiler-2.0.21-maven.tar.gz > familyguard-kids-kotlin-compiler-2.0.21-maven.tar.gz.sha256
          du -sh "$OUT" familyguard-kids-kotlin-compiler-2.0.21-maven.tar.gz

      - name: Upload Kotlin compiler Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-kids-kotlin-compiler-2-0-21-maven
          path: |
            familyguard-kids-kotlin-compiler-2.0.21-maven.tar.gz
            familyguard-kids-kotlin-compiler-2.0.21-maven.tar.gz.sha256
            compiler-maven-files.txt
          compression-level: 0
          retention-days: 1
