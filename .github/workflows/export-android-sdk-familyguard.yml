name: Split FamilyGuard offline dependency artifact

on:
  push:
    branches:
      - temp-android-sdk-bootstrap-20260815
  workflow_dispatch:

jobs:
  split-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Download completed dependency artifact
        uses: actions/download-artifact@v4
        with:
          name: familyguard-offline-deps-linux
          path: inbound
          github-token: ${{ github.token }}
          repository: przdanig1-png/Sistema
          run-id: 31917865286

      - name: Verify and split below connector limit
        shell: bash
        run: |
          set -euo pipefail
          cd inbound
          sha256sum -c familyguard-offline-deps-linux.tar.gz.sha256
          split -b 350M -d -a 2 familyguard-offline-deps-linux.tar.gz familyguard-offline-deps.part-
          ls -lh familyguard-offline-deps.part-*
          test -f familyguard-offline-deps.part-00
          test -f familyguard-offline-deps.part-01
          test -f familyguard-offline-deps.part-02
          test -f familyguard-offline-deps.part-03

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-offline-deps-part-00
          path: inbound/familyguard-offline-deps.part-00
          compression-level: 0
          retention-days: 1

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-offline-deps-part-01
          path: inbound/familyguard-offline-deps.part-01
          compression-level: 0
          retention-days: 1

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-offline-deps-part-02
          path: inbound/familyguard-offline-deps.part-02
          compression-level: 0
          retention-days: 1

      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-offline-deps-part-03
          path: inbound/familyguard-offline-deps.part-03
          compression-level: 0
          retention-days: 1

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-offline-deps-checksum
          path: inbound/familyguard-offline-deps-linux.tar.gz.sha256
          compression-level: 0
          retention-days: 1
