name: Export FamilyGuard Kids Kotlin 2.0.21 local Maven dependencies

on:
  push:
    branches:
      - temp-android-sdk-bootstrap-20260815
  workflow_dispatch:

jobs:
  export-kids-kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve Kotlin 2.0.21 family and build local Maven layout
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/fg-kotlin-warm"
          GH="$RUNNER_TEMP/fg-kotlin-gradle-home"
          OUT="$GITHUB_WORKSPACE/kotlin-maven"
          rm -rf "$WORK" "$GH" "$OUT"
          mkdir -p "$WORK" "$GH" "$OUT"
          cd "$WORK"
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='fg-kotlin-warm'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'base' }
          configurations { warm }
          dependencies {
            warm platform('org.jetbrains.kotlin:kotlin-bom:2.0.21')
            warm 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
            warm 'org.jetbrains.kotlin:kotlin-stdlib-common:2.0.21'
            warm 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.21'
            warm 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21'
            warm 'org.jetbrains.kotlin:kotlin-reflect:2.0.21'
          }
          tasks.register('warmDependencies') { doLast { configurations.warm.files.each { println it } } }
          EOF
          GRADLE_USER_HOME="$GH" gradle warmDependencies --no-daemon --stacktrace

          BASE="$GH/caches/modules-2/files-2.1/org.jetbrains.kotlin"
          test -d "$BASE"
          for MODPATH in "$BASE"/*; do
            [ -d "$MODPATH" ] || continue
            MOD="$(basename "$MODPATH")"
            for VERPATH in "$MODPATH"/*; do
              [ -d "$VERPATH" ] || continue
              VER="$(basename "$VERPATH")"
              DEST="$OUT/org/jetbrains/kotlin/$MOD/$VER"
              mkdir -p "$DEST"
              find "$VERPATH" -type f \( -name '*.pom' -o -name '*.jar' -o -name '*.module' \) -exec cp -f {} "$DEST/" \;
            done
          done
          find "$OUT" -type f -printf '%P %s\n' | sort
          tar -C "$OUT" -czf "$GITHUB_WORKSPACE/familyguard-kids-kotlin-2.0.21-local-maven.tar.gz" .
          sha256sum "$GITHUB_WORKSPACE/familyguard-kids-kotlin-2.0.21-local-maven.tar.gz" > "$GITHUB_WORKSPACE/familyguard-kids-kotlin-2.0.21-local-maven.tar.gz.sha256"

      - name: Upload Kotlin local Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-kids-kotlin-2-0-21-local-maven
          path: |
            familyguard-kids-kotlin-2.0.21-local-maven.tar.gz
            familyguard-kids-kotlin-2.0.21-local-maven.tar.gz.sha256
          compression-level: 0
          retention-days: 1
