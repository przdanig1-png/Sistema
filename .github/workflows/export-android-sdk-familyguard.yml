name: Export FamilyGuard Android 34 tools and exact offline cache

on:
  push:
    branches:
      - temp-android-sdk-bootstrap-20260815
  workflow_dispatch:

jobs:
  export-missing-local-lab-bits:
    runs-on: ubuntu-latest
    steps:
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 34 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          mkdir -p sdk34/platforms sdk34/build-tools
          cp -a "$ANDROID_SDK_ROOT/platforms/android-34" sdk34/platforms/
          cp -a "$ANDROID_SDK_ROOT/build-tools/34.0.0" sdk34/build-tools/
          tar -C sdk34 -czf familyguard-android34-tools.tar.gz .
          sha256sum familyguard-android34-tools.tar.gz > familyguard-android34-tools.tar.gz.sha256
          ls -lh familyguard-android34-tools.tar.gz

      - name: Warm exact error-prone annotations 2.15.0 cache
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/fg-errorprone-warm"
          GH="$RUNNER_TEMP/fg-errorprone-gradle-home"
          rm -rf "$WORK" "$GH"
          mkdir -p "$WORK" "$GH"
          cd "$WORK"
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='fg-errorprone-warm'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'base' }
          configurations { warm }
          dependencies { warm 'com.google.errorprone:error_prone_annotations:2.15.0' }
          tasks.register('warmDependencies') { doLast { configurations.warm.files.each { println it } } }
          EOF
          GRADLE_USER_HOME="$GH" gradle warmDependencies --no-daemon --stacktrace
          mkdir -p "$RUNNER_TEMP/export-cache"
          cp -a "$GH/caches/modules-2" "$RUNNER_TEMP/export-cache/"
          tar -C "$RUNNER_TEMP/export-cache" -czf "$GITHUB_WORKSPACE/familyguard-errorprone-2.15.0-cache.tar.gz" .
          sha256sum "$GITHUB_WORKSPACE/familyguard-errorprone-2.15.0-cache.tar.gz" > "$GITHUB_WORKSPACE/familyguard-errorprone-2.15.0-cache.tar.gz.sha256"
          ls -lh "$GITHUB_WORKSPACE/familyguard-errorprone-2.15.0-cache.tar.gz"

      - name: Upload Android 34 tools
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-android34-tools
          path: |
            familyguard-android34-tools.tar.gz
            familyguard-android34-tools.tar.gz.sha256
          compression-level: 0
          retention-days: 1

      - name: Upload exact error-prone cache
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-errorprone-2-15-0-cache
          path: |
            familyguard-errorprone-2.15.0-cache.tar.gz
            familyguard-errorprone-2.15.0-cache.tar.gz.sha256
          compression-level: 0
          retention-days: 1
