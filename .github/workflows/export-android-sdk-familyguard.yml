name: Export FamilyGuard Kids ML Kit AARs

on:
  push:
    branches:
      - temp-android-sdk-bootstrap-20260815
  workflow_dispatch:

jobs:
  export-kids-mlkit:
    runs-on: ubuntu-latest
    steps:
      - name: Build exact local Maven layout
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/mlkit-maven"
          mkdir -p "$OUT"
          fetch_coord() {
            local group="$1" artifact="$2" version="$3" ext="$4"
            local gp="${group//./\/}"
            local dir="$OUT/$gp/$artifact/$version"
            local base="https://dl.google.com/dl/android/maven2/$gp/$artifact/$version"
            mkdir -p "$dir"
            curl -fL --retry 4 --retry-all-errors -o "$dir/$artifact-$version.pom" "$base/$artifact-$version.pom"
            curl -fL --retry 4 --retry-all-errors -o "$dir/$artifact-$version.$ext" "$base/$artifact-$version.$ext"
          }
          fetch_coord com.google.mlkit common 18.5.0 aar
          fetch_coord com.google.mlkit vision-common 17.2.0 aar
          fetch_coord com.google.mlkit vision-interfaces 16.1.0 aar
          find "$OUT" -type f -printf '%P %s\n' | sort
          tar -C "$OUT" -czf familyguard-kids-mlkit-local-maven.tar.gz .
          sha256sum familyguard-kids-mlkit-local-maven.tar.gz > familyguard-kids-mlkit-local-maven.tar.gz.sha256

      - name: Upload ML Kit local Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-kids-mlkit-local-maven
          path: |
            familyguard-kids-mlkit-local-maven.tar.gz
            familyguard-kids-mlkit-local-maven.tar.gz.sha256
          compression-level: 0
          retention-days: 1
