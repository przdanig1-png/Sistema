name: Export FamilyGuard missing public Maven dependencies

on:
  push:
    branches:
      - temp-android-sdk-bootstrap-20260815
    paths:
      - 'familyguard-bootstrap/export-missing-maven.json'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve exact AndroidX artifacts
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/fg-exact-warm"
          GH="$RUNNER_TEMP/fg-exact-gradle"
          OUT="$GITHUB_WORKSPACE/local-maven"
          rm -rf "$WORK" "$GH" "$OUT"
          mkdir -p "$WORK" "$GH" "$OUT"
          cd "$WORK"
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='fg-exact-warm'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'base' }
          configurations {
            exactCore130 { transitive = false }
            exactCoreKtx120 { transitive = false }
          }
          dependencies {
            exactCore130 'androidx.core:core:1.13.0'
            exactCoreKtx120 'androidx.core:core-ktx:1.2.0'
          }
          tasks.register('warmExact') {
            doLast {
              configurations.exactCore130.files.each { println it }
              configurations.exactCoreKtx120.files.each { println it }
            }
          }
          EOF
          GRADLE_USER_HOME="$GH" gradle warmExact --no-daemon --stacktrace

          BASE="$GH/caches/modules-2/files-2.1/androidx.core"
          for MOD in core core-ktx; do
            SRC="$BASE/$MOD"
            [ -d "$SRC" ] || continue
            find "$SRC" -mindepth 1 -maxdepth 1 -type d | while read -r VERPATH; do
              VER="$(basename "$VERPATH")"
              DEST="$OUT/androidx/core/$MOD/$VER"
              mkdir -p "$DEST"
              find "$VERPATH" -type f \( -name '*.pom' -o -name '*.jar' -o -name '*.aar' -o -name '*.module' \) -exec cp -f {} "$DEST/" \;
            done
          done
          find "$OUT" -type f -printf '%P %s\n' | sort
          tar -C "$OUT" -czf "$GITHUB_WORKSPACE/familyguard-exact-androidx-local-maven.tar.gz" .
          sha256sum "$GITHUB_WORKSPACE/familyguard-exact-androidx-local-maven.tar.gz" > "$GITHUB_WORKSPACE/familyguard-exact-androidx-local-maven.tar.gz.sha256"

      - name: Upload exact AndroidX package
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-exact-androidx-local-maven
          path: |
            familyguard-exact-androidx-local-maven.tar.gz
            familyguard-exact-androidx-local-maven.tar.gz.sha256
          compression-level: 0
          retention-days: 1
