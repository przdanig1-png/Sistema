name: Package Android QA Toolchain

on:
  push:
    paths:
      - '.github/workflows/package-android-qa-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Android QA components
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | head -1)
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "emulator" \
            "cmdline-tools;latest" \
            "system-images;android-35;default;x86_64"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"
          test -f "$ANDROID_SDK_ROOT/system-images/android-35/default/x86_64/package.xml"

      - name: Package and split runtime
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ANDROID_SDK_ROOT"
          tar -cf - \
            platform-tools \
            emulator \
            cmdline-tools/latest \
            system-images/android-35/default/x86_64 \
            | zstd -T0 -10 -o "$RUNNER_TEMP/android-qa-sdk-api35-x86_64.tar.zst"
          cd "$RUNNER_TEMP"
          sha256sum android-qa-sdk-api35-x86_64.tar.zst > SHA256SUMS.txt
          split -b 450m -d -a 2 android-qa-sdk-api35-x86_64.tar.zst android-qa-sdk.part-
          test -f android-qa-sdk.part-00
          test -f android-qa-sdk.part-01
          test -f android-qa-sdk.part-02
          ls -lh android-qa-sdk.part-* SHA256SUMS.txt

      - name: Upload bridge part 00
        uses: actions/upload-artifact@v4
        with:
          name: android-qa-sdk-part00
          path: ${{ runner.temp }}/android-qa-sdk.part-00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload bridge part 01
        uses: actions/upload-artifact@v4
        with:
          name: android-qa-sdk-part01
          path: ${{ runner.temp }}/android-qa-sdk.part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload bridge part 02
        uses: actions/upload-artifact@v4
        with:
          name: android-qa-sdk-part02
          path: ${{ runner.temp }}/android-qa-sdk.part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload bridge checksum
        uses: actions/upload-artifact@v4
        with:
          name: android-qa-sdk-sha
          path: ${{ runner.temp }}/SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
