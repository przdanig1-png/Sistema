name: Warm Carwash Flutter 3.47 Gradle 8.14 Full Cache

on:
  push:
    paths:
      - '.github/workflows/warm-carwash-flutter347-gradle814-full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: false

      - name: Create exact public seed and build with Gradle 8.14
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version
          flutter create --platforms=android "$RUNNER_TEMP/carwash_seed"
          cd "$RUNNER_TEMP/carwash_seed"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/settings.gradle.kts')
          s=p.read_text()
          import re
          s=re.sub(r'id\("com\.android\.application"\) version "[^"]+" apply false', 'id("com.android.application") version "8.11.1" apply false', s)
          s=re.sub(r'id\("org\.jetbrains\.kotlin\.android"\) version "[^"]+" apply false', 'id("org.jetbrains.kotlin.android") version "2.2.20" apply false', s)
          p.write_text(s)
          p=Path('android/gradle/wrapper/gradle-wrapper.properties')
          s=p.read_text()
          s=re.sub(r'distributionUrl=.*', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip', s)
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          if 'androidx.core:core-ktx:1.13.1' not in s:
              s += '\n\ndependencies {\n    implementation("androidx.core:core-ktx:1.13.1")\n}\n'
          p.write_text(s)
          PY

          flutter pub get
          flutter build apk --debug
          ./android/gradlew -p android help --no-daemon
          test -d "$HOME/.gradle/caches/modules-2"

      - name: Package complete Gradle modules cache
        shell: bash
        run: |
          set -euxo pipefail
          tar -C "$HOME/.gradle/caches" -cf - modules-2 | zstd -T0 -8 -o "$RUNNER_TEMP/carwash-flutter347-gradle814-full.tar.zst"
          sha256sum "$RUNNER_TEMP/carwash-flutter347-gradle814-full.tar.zst" > "$RUNNER_TEMP/carwash-flutter347-gradle814-full.sha256"
          ls -lh "$RUNNER_TEMP/carwash-flutter347-gradle814-full.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: carwash-flutter347-gradle814-full
          path: |
            ${{ runner.temp }}/carwash-flutter347-gradle814-full.tar.zst
            ${{ runner.temp }}/carwash-flutter347-gradle814-full.sha256
          compression-level: 0
          retention-days: 1
