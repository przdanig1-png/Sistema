name: Package Flutter Android Build Toolchain

on:
  push:
    paths:
      - '.github/workflows/package-flutter-carwash-build-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: false

      - name: Warm public Flutter and Gradle dependencies
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version
          flutter create --platforms=android "$RUNNER_TEMP/dummy"
          cat > "$RUNNER_TEMP/dummy/pubspec.yaml" <<'YAML'
          name: carwash_toolchain_dummy
          description: Public dependency warmer only
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.3.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.2
            provider: ^6.1.2
            path_provider: ^2.1.4
            url_launcher: ^6.3.0
            pdf: ^3.11.1
            printing: ^5.13.4
            share_plus: ^10.0.2
            shared_preferences: ^2.3.2
            device_info_plus: ^10.1.2
            image_picker: ^1.1.2
            google_mlkit_text_recognition: ^0.13.0
            google_mlkit_image_labeling: ^0.11.0
            image: ^4.2.0
            mobile_scanner: ^7.1.4
            qr: ^3.0.2
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
          flutter:
            uses-material-design: true
          YAML
          cd "$RUNNER_TEMP/dummy"
          flutter pub get
          flutter build apk --debug
          FLUTTER_BIN=$(command -v flutter)
          FLUTTER_ROOT=$(dirname "$(dirname "$FLUTTER_BIN")")
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          echo "PUB_CACHE=${PUB_CACHE:-$HOME/.pub-cache}" >> "$GITHUB_ENV"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          du -sh "$FLUTTER_ROOT" "${PUB_CACHE:-$HOME/.pub-cache}" "$HOME/.gradle" || true
          ls -d "$ANDROID_SDK_ROOT/platforms/android-36" "$ANDROID_SDK_ROOT/build-tools"/* | tail -5
          ls -d "$ANDROID_SDK_ROOT/ndk"/* | tail -5 || true

      - name: Package and split build toolchain
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/build-toolchain"
          mkdir -p "$STAGE/android-sdk" "$STAGE/home"
          cp -a "$FLUTTER_ROOT" "$STAGE/flutter"
          cp -a "$PUB_CACHE" "$STAGE/pub-cache"
          cp -a "$HOME/.gradle" "$STAGE/home/.gradle"
          cp -a "$ANDROID_SDK_ROOT/platforms/android-36" "$STAGE/android-sdk/platforms-android-36"
          mkdir -p "$STAGE/android-sdk/build-tools"
          cp -a "$ANDROID_SDK_ROOT/build-tools/36.0.0" "$STAGE/android-sdk/build-tools/36.0.0" || cp -a "$(ls -d "$ANDROID_SDK_ROOT/build-tools"/* | sort -V | tail -1)" "$STAGE/android-sdk/build-tools/"
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then cp -a "$ANDROID_SDK_ROOT/ndk" "$STAGE/android-sdk/ndk"; fi
          tar -C "$STAGE" -cf - . | zstd -T0 -8 -o "$RUNNER_TEMP/flutter-carwash-build-toolchain.tar.zst"
          cd "$RUNNER_TEMP"
          sha256sum flutter-carwash-build-toolchain.tar.zst > flutter-carwash-build-toolchain.sha256
          split -b 400m -d -a 2 flutter-carwash-build-toolchain.tar.zst flutter-build.part-
          ls -lh flutter-build.part-* flutter-carwash-build-toolchain.sha256

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-part00
          path: ${{ runner.temp }}/flutter-build.part-00
          compression-level: 0
          retention-days: 1
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-part01
          path: ${{ runner.temp }}/flutter-build.part-01
          compression-level: 0
          retention-days: 1
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-part02
          path: ${{ runner.temp }}/flutter-build.part-02
          compression-level: 0
          retention-days: 1
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-part03
          path: ${{ runner.temp }}/flutter-build.part-03
          compression-level: 0
          retention-days: 1
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-part04
          path: ${{ runner.temp }}/flutter-build.part-04
          compression-level: 0
          retention-days: 1
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-part05
          path: ${{ runner.temp }}/flutter-build.part-05
          compression-level: 0
          retention-days: 1
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-part06
          path: ${{ runner.temp }}/flutter-build.part-06
          compression-level: 0
          retention-days: 1
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-sha
          path: ${{ runner.temp }}/flutter-carwash-build-toolchain.sha256
          compression-level: 0
          retention-days: 1
