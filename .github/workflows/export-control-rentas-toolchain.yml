name: Export Control Rentas Offline Toolchain

on:
  push:
    paths:
      - '.github/workflows/export-control-rentas-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-control-rentas-toolchain
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Prepare Android SDK API 36
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | head -1); fi
          test -n "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'cmdline-tools;latest'
          flutter precache --android
          flutter --version
          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/build-tools/36.0.0"

      - name: Warm exact Control Rentas dependency graph
        shell: bash
        run: |
          set -euxo pipefail
          flutter create --platforms=android --org com.example seed
          cd seed
          cat > pubspec.yaml <<'PUBSPEC'
          name: control_rentas_seed
          description: Offline dependency seed for Control Rentas v419
          publish_to: 'none'
          version: 0.5.110+419
          environment:
            sdk: '>=3.11.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            shared_preferences: ^2.2.3
            intl: ^0.19.0
            image_picker: ^1.1.2
            image: ^4.8.0
            share_plus: ^10.1.4
            path_provider: ^2.1.4
            pdf: ^3.11.1
            url_launcher: ^6.3.0
            file_picker: ^8.0.7
            archive: ^4.0.9
            local_auth: ^2.3.0
            firebase_core: ^3.6.0
            firebase_messaging: ^15.1.3
            cloud_firestore: ^5.6.12
            flutter_local_notifications: ^17.2.3
            timezone: ^0.9.4
            permission_handler: ^11.3.1
            audioplayers: ^6.1.0
            workmanager: 0.9.0+3
          dev_dependencies:
            flutter_lints: ^5.0.0
          flutter:
            uses-material-design: true
          PUBSPEC
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('android/settings.gradle.kts')
          t=s.read_text()
          t=re.sub(r'id\("com\.android\.application"\) version "[^"]+" apply false', 'id("com.android.application") version "8.11.1" apply false', t)
          t=re.sub(r'id\("org\.jetbrains\.kotlin\.android"\) version "[^"]+" apply false', 'id("org.jetbrains.kotlin.android") version "2.2.20" apply false', t)
          if 'com.google.gms.google-services' not in t:
              t=t.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.4.3" apply false', 1)
          s.write_text(t)
          w=Path('android/gradle/wrapper/gradle-wrapper.properties')
          wt=w.read_text()
          wt=re.sub(r'gradle-[^/]+-(?:all|bin)\.zip', 'gradle-8.14-all.zip', wt)
          w.write_text(wt)
          a=Path('android/app/build.gradle.kts')
          at=a.read_text()
          at=at.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          at=at.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
          at += '''\n\ndependencies {\n    implementation(platform("com.google.firebase:firebase-bom:33.16.0"))\n    implementation("com.google.firebase:firebase-messaging")\n    implementation("androidx.core:core:1.15.0")\n    implementation("androidx.core:core-ktx:1.15.0")\n    implementation("androidx.activity:activity:1.10.1")\n    implementation("androidx.activity:activity-ktx:1.10.1")\n    implementation("androidx.browser:browser:1.8.0")\n    implementation("androidx.navigationevent:navigationevent-android:1.0.0")\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'''
          at=at.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
          a.write_text(at)
          PY
          flutter pub get
          flutter build apk --debug
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ./android/gradlew -p android --version | grep -F 'Gradle 8.14'
          cd ..

      - name: Package and split Flutter SDK
        shell: bash
        run: |
          set -euxo pipefail
          FLUTTER_BIN=$(command -v flutter)
          FLUTTER_ROOT=$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)
          echo "$FLUTTER_ROOT" > "$RUNNER_TEMP/flutter-root.txt"
          tar --use-compress-program='zstd -T0 -3' -cf "$RUNNER_TEMP/flutter-3.41.9-linux.tar.zst" -C "$(dirname "$FLUTTER_ROOT")" "$(basename "$FLUTTER_ROOT")"
          cd "$RUNNER_TEMP"
          sha256sum flutter-3.41.9-linux.tar.zst > flutter-SHA256SUMS.txt
          split -b 400m -d -a 2 flutter-3.41.9-linux.tar.zst flutter-sdk.part-
          ls -lh flutter-sdk.part-* flutter-SHA256SUMS.txt

      - name: Package Android SDK minimum
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/android-sdk-min"
          mkdir -p "$STAGE"
          for d in platform-tools platforms/android-36 build-tools/36.0.0 cmdline-tools/latest licenses; do
            mkdir -p "$STAGE/$(dirname "$d")"
            cp -a "$ANDROID_SDK_ROOT/$d" "$STAGE/$d"
          done
          tar --use-compress-program='zstd -T0 -3' -cf "$RUNNER_TEMP/android-sdk-api36-min.tar.zst" -C "$STAGE" .
          cd "$RUNNER_TEMP"
          sha256sum android-sdk-api36-min.tar.zst > android-SHA256SUMS.txt
          ls -lh android-sdk-api36-min.tar.zst android-SHA256SUMS.txt

      - name: Package and split offline caches
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/offline-caches"
          mkdir -p "$STAGE/home"
          if [ -d "$HOME/.pub-cache" ]; then cp -a "$HOME/.pub-cache" "$STAGE/home/pub-cache"; fi
          if [ -d "$HOME/.gradle" ]; then cp -a "$HOME/.gradle" "$STAGE/home/gradle"; fi
          tar --use-compress-program='zstd -T0 -3' -cf "$RUNNER_TEMP/control-rentas-v419-offline-caches.tar.zst" -C "$STAGE" .
          cd "$RUNNER_TEMP"
          sha256sum control-rentas-v419-offline-caches.tar.zst > caches-SHA256SUMS.txt
          split -b 400m -d -a 2 control-rentas-v419-offline-caches.tar.zst caches.part-
          ls -lh caches.part-* caches-SHA256SUMS.txt

      - name: Upload Flutter metadata
        uses: actions/upload-artifact@v4
        with:
          name: control-rentas-flutter-meta
          path: |
            ${{ runner.temp }}/flutter-SHA256SUMS.txt
            ${{ runner.temp }}/flutter-root.txt
          retention-days: 1
          if-no-files-found: error
      - name: Upload Flutter part 00
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-flutter-part00, path: '${{ runner.temp }}/flutter-sdk.part-00', compression-level: 0, retention-days: 1, if-no-files-found: error}
      - name: Upload Flutter part 01
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-flutter-part01, path: '${{ runner.temp }}/flutter-sdk.part-01', compression-level: 0, retention-days: 1, if-no-files-found: error}
      - name: Upload Flutter part 02
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-flutter-part02, path: '${{ runner.temp }}/flutter-sdk.part-02', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload Flutter part 03
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-flutter-part03, path: '${{ runner.temp }}/flutter-sdk.part-03', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload Flutter part 04
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-flutter-part04, path: '${{ runner.temp }}/flutter-sdk.part-04', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload Flutter part 05
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-flutter-part05, path: '${{ runner.temp }}/flutter-sdk.part-05', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload Flutter part 06
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-flutter-part06, path: '${{ runner.temp }}/flutter-sdk.part-06', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload Flutter part 07
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-flutter-part07, path: '${{ runner.temp }}/flutter-sdk.part-07', compression-level: 0, retention-days: 1, if-no-files-found: ignore}

      - name: Upload Android API36 SDK
        uses: actions/upload-artifact@v4
        with:
          name: control-rentas-android-sdk-api36
          path: |
            ${{ runner.temp }}/android-sdk-api36-min.tar.zst
            ${{ runner.temp }}/android-SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload cache metadata
        uses: actions/upload-artifact@v4
        with:
          name: control-rentas-caches-meta
          path: ${{ runner.temp }}/caches-SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
      - name: Upload caches part 00
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-caches-part00, path: '${{ runner.temp }}/caches.part-00', compression-level: 0, retention-days: 1, if-no-files-found: error}
      - name: Upload caches part 01
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-caches-part01, path: '${{ runner.temp }}/caches.part-01', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload caches part 02
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-caches-part02, path: '${{ runner.temp }}/caches.part-02', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload caches part 03
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-caches-part03, path: '${{ runner.temp }}/caches.part-03', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload caches part 04
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-caches-part04, path: '${{ runner.temp }}/caches.part-04', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload caches part 05
        uses: actions/upload-artifact@v4
        with: {name: control-rentas-caches-part05, path: '${{ runner.temp }}/caches.part-05', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
