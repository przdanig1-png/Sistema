name: Export Control Rentas Offline Toolchain

on:
  push:
    paths:
      - '.github/workflows/export-control-rentas-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-control-rentas-toolchain
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Prepare Android SDK API 36
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'cmdline-tools;latest'
          flutter precache --android
          flutter --version
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Warm Control Rentas v419 dependencies
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 'https://drive.google.com/uc?export=download&id=1pGHsIgkV6-HO64abtrxdxqsX8E57yKEt' -o source419.zip
          echo 'daff31a8e3312b90a36c91bfbda295d750483fd81b41326e437d47f8648451a7  source419.zip' | sha256sum -c -
          mkdir src
          unzip -q source419.zip -d src
          grep -F 'version: 0.5.110+419' src/pubspec.yaml
          cd src
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --debug
          cd ..
          test -f src/build/app/outputs/flutter-apk/app-debug.apk

      - name: Package Flutter SDK
        shell: bash
        run: |
          set -euxo pipefail
          FLUTTER_BIN=$(command -v flutter)
          FLUTTER_ROOT=$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)
          echo "$FLUTTER_ROOT" > flutter-root.txt
          tar --use-compress-program='zstd -T0 -3' -cf flutter-3.41.9-linux.tar.zst -C "$(dirname "$FLUTTER_ROOT")" "$(basename "$FLUTTER_ROOT")"
          sha256sum flutter-3.41.9-linux.tar.zst > flutter-3.41.9-linux.tar.zst.sha256
          ls -lh flutter-3.41.9-linux.tar.zst

      - name: Package Android SDK minimum
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/android-sdk-min"
          mkdir -p "$STAGE"
          for d in platform-tools platforms/android-36 build-tools/36.0.0 cmdline-tools/latest licenses; do
            mkdir -p "$STAGE/$(dirname "$d")"
            cp -a "$ANDROID_SDK_ROOT/$d" "$STAGE/$d"
          done
          tar --use-compress-program='zstd -T0 -3' -cf android-sdk-api36-min.tar.zst -C "$STAGE" .
          sha256sum android-sdk-api36-min.tar.zst > android-sdk-api36-min.tar.zst.sha256
          ls -lh android-sdk-api36-min.tar.zst

      - name: Package offline caches
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/offline-caches"
          mkdir -p "$STAGE/home"
          if [ -d "$HOME/.pub-cache" ]; then cp -a "$HOME/.pub-cache" "$STAGE/home/pub-cache"; fi
          if [ -d "$HOME/.gradle" ]; then cp -a "$HOME/.gradle" "$STAGE/home/gradle"; fi
          tar --use-compress-program='zstd -T0 -3' -cf control-rentas-v419-offline-caches.tar.zst -C "$STAGE" .
          sha256sum control-rentas-v419-offline-caches.tar.zst > control-rentas-v419-offline-caches.tar.zst.sha256
          ls -lh control-rentas-v419-offline-caches.tar.zst

      - name: Upload Flutter SDK
        uses: actions/upload-artifact@v4
        with:
          name: control-rentas-flutter-3.41.9
          path: |
            flutter-3.41.9-linux.tar.zst
            flutter-3.41.9-linux.tar.zst.sha256
            flutter-root.txt
          compression-level: 0
          retention-days: 1

      - name: Upload Android SDK
        uses: actions/upload-artifact@v4
        with:
          name: control-rentas-android-sdk-api36
          path: |
            android-sdk-api36-min.tar.zst
            android-sdk-api36-min.tar.zst.sha256
          compression-level: 0
          retention-days: 1

      - name: Upload offline caches
        uses: actions/upload-artifact@v4
        with:
          name: control-rentas-v419-offline-caches
          path: |
            control-rentas-v419-offline-caches.tar.zst
            control-rentas-v419-offline-caches.tar.zst.sha256
          compression-level: 0
          retention-days: 1
